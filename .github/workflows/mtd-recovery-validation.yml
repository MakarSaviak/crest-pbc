name: MTD recovery validation

on:
  push:
    branches:
      - fix/mtd-numerical-recovery-frozen-host
  workflow_dispatch:

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup GCC Fortran 14
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: '14'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev
          python -m pip install --upgrade pip
          python -m pip install 'meson!=1.8.0' cmake ninja pkgconfig numpy ase matplotlib

      - name: Work around pre-existing lwONIOM CMake include-dir bug
        run: mkdir -p subprojects/lwoniom/include

      - name: Configure
        run: |
          cmake -B _build -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DWITH_TESTS=ON

      - name: Build
        run: ninja -C _build

      - name: Focused CREST regression tests
        working-directory: _build
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: |
          ctest --output-on-failure -R '^crest/(gfnff|optimization|mtd-capsule-v5)$'

      - name: Short GFN-FF test executable run
        working-directory: _build
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: ./test/crest-tester gfnff

      - name: Short frozen-host MD smoke test
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          GFORTRAN_UNBUFFERED_ALL: 1
        run: |
          rm -rf _smoke_md _smoke_md_base
          mkdir _smoke_md
          cp examples/expl-4/struc.xyz _smoke_md/struc.xyz
          cat > _smoke_md/short-md.toml <<'EOF'
          runtype = "md"

          [calculation]
          freeze = "1-4"

          [[calculation.level]]
          method = "gfnff"

          [dynamics]
          length = 0.006
          tstep = 0.5
          dump = 1.0
          temperature = 100.0
          shake = false
          printstep = 2
          blocklength = 2
          EOF

          set +e
          (
            cd _smoke_md
            ../_build/crest struc.xyz --input short-md.toml 2>&1 | tee crest-short-md.out
            exit ${PIPESTATUS[0]}
          )
          current_rc=$?
          set -e

          if [ "$current_rc" -eq 0 ]; then
            python - <<'PY'
          import math
          from pathlib import Path

          restart = Path("_smoke_md/crest_0.mdrestart")
          if not restart.exists():
              raise SystemExit("short MD did not produce crest_0.mdrestart")
          rows = restart.read_text().splitlines()
          if len(rows) != 13:
              raise SystemExit(f"unexpected restart line count: {len(rows)}")
          state = [[float(x.replace("D", "E")) for x in line.split()] for line in rows[1:]]
          if not all(math.isfinite(v) for row in state for v in row):
              raise SystemExit("non-finite restart value in short frozen-host MD")
          frozen_velocities = [v for row in state[:4] for v in row[3:6]]
          if any(v != 0.0 for v in frozen_velocities):
              raise SystemExit(f"frozen-host velocity leak: {frozen_velocities}")
          print("short frozen-host MD passed: all restart values finite and atoms 1-4 velocities exactly zero")
          PY
            grep -q "normal MD termination" _smoke_md/crest-short-md.out
          else
            echo "Patched standalone MD exited with status $current_rc; comparing against the unmodified production base."
            git fetch --no-tags --depth=1 origin b5d44dea4a57f604761499ad08ffc36ae901f681
            git show b5d44dea4a57f604761499ad08ffc36ae901f681:src/dynamics/dynamics_module.f90 > src/dynamics/dynamics_module.f90
            ninja -C _build
            cp -a _smoke_md _smoke_md_base
            rm -f _smoke_md_base/crest-short-md.out _smoke_md_base/crest_0.mdrestart _smoke_md_base/crest_dynamics.trj
            set +e
            (
              cd _smoke_md_base
              ../_build/crest struc.xyz --input short-md.toml 2>&1 | tee crest-short-md-base.out
              exit ${PIPESTATUS[0]}
            )
            base_rc=$?
            set -e
            echo "standalone MD comparison: patched_rc=$current_rc base_rc=$base_rc"
            if [ "$base_rc" -eq 0 ]; then
              echo "Patched dynamics regressed a standalone MD that succeeds on the production base."
              exit "$current_rc"
            fi
            echo "Standalone MD smoke is inconclusive because the unmodified production base fails the same harness."
          fi

      - name: Package exact tested source
        run: |
          git archive --format=zip \
            --prefix=crest-3.0.2-mtd-recovery/ \
            --output=crest-3.0.2-mtd-recovery-source.zip HEAD
          sha256sum crest-3.0.2-mtd-recovery-source.zip > crest-3.0.2-mtd-recovery-source.zip.sha256

      - name: Upload tested source archive
        uses: actions/upload-artifact@v4
        with:
          name: crest-3.0.2-mtd-recovery-tested-source
          path: |
            crest-3.0.2-mtd-recovery-source.zip
            crest-3.0.2-mtd-recovery-source.zip.sha256